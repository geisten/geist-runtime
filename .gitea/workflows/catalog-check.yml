# The bundled catalog's downloads still answer with the catalog's size and
# SHA-256 (HEAD requests only, nothing downloaded): weekly and on demand.
name: catalog-check
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every model URL answers with the catalog's size and SHA-256
        run: python3 tools/check_catalog.py
