# #94: the x86 CPU decision evidence on the current engine pin, on demand.
# The records come back as an artifact; they are committed by hand.
name: decision-evidence
on:
  workflow_dispatch:
permissions:
  contents: read

env:
  GEIST_REPO: ${{ vars.GEIST_REPO || 'https://git.geisten.net/geisten/geistlib.git' }}  # the engine from Gitea; the Makefile default is GitHub
jobs:
  x86:
    runs-on: geist-vulkan
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: records, CLI and Python controls (Gemma 4 E2B, cpu_x86)
        run: sh scripts/decision-evidence-x86.sh build/evidence-x86 2>&1 | tee build-evidence.log
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: decision-evidence-x86
          path: |
            build/evidence-x86/
            build-evidence.log
