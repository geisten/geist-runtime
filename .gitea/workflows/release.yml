name: release

# geistr binaries for install.sh: a fully static Linux build per architecture
# (musl, scripts/build-static.sh) and macOS arm64 (system libraries only).
#
# Run by hand (Actions → release → Run workflow): builds and tests the
# archives and keeps them as workflow artifacts; nothing is published.
# A pushed tag vX.Y.Z (= geistr --version) also uploads the archives, the Python wheels and
# SHA256SUMS to www.geisten.net/download/geistr/vX.Y.Z/, checks them over HTTPS and
# points "latest" there. Run by hand with the input `tag` (an existing vX.Y.Z), it
# publishes that tag the same way, e.g. to repeat a release that failed after the build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish this existing tag (vX.Y.Z) with the workflow as it is on the chosen branch; empty: build only'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}  # the tag pushed, or the one dispatched
  GEIST_REPO: ${{ vars.GEIST_REPO || 'https://git.geisten.net/geisten/geistlib.git' }}  # the engine from Gitea; the Makefile default is GitHub
  # geistlib is private on Gitea: git rewrites only its URL to carry the token (secret GEISTLIB_TOKEN, read:repository), nothing is written to disk
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://oauth2:${{ secrets.GEISTLIB_TOKEN }}@git.geisten.net/geisten/geistlib.insteadOf
  GIT_CONFIG_VALUE_0: https://git.geisten.net/geisten/geistlib

defaults:
  run:
    shell: bash

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-amd64, qemu: qemu-x86_64, old_cpu: Nehalem}
          - {runner: ubuntu-24.04-arm, target: linux-arm64, qemu: qemu-aarch64, old_cpu: cortex-a72}
    name: ${{ matrix.target }} (musl, static)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: build in Alpine
        run: docker run --rm -e GEIST_REPO -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 -v "$PWD:/src" -w /src alpine:3.21 sh scripts/build-static.sh
      - name: no dynamic dependencies; it downloads (HTTPS, SHA-256) and answers
        run: |
          info=$(file build/static/geistr) && echo "$info"
          grep -q 'statically linked' <<<"$info"
          export GEISTEN_HOME="$RUNNER_TEMP/h"
          build/static/geistr pull smollm2-360m
          answer=$(build/static/geistr run smollm2-360m 'What is the capital of France? One word.')
          echo "$answer" && grep -qi paris <<<"$answer"
      - name: on a CPU below the baseline it says so, instead of dying
        run: |
          sh scripts/apt-need.sh ${{ matrix.qemu }}:qemu-user
          set +e
          out=$(${{ matrix.qemu }} -cpu ${{ matrix.old_cpu }} build/static/geistr --version 2>&1); rc=$?
          set -e
          echo "$out (exit $rc)"
          test $rc -eq 1 && grep -q 'this CPU lacks' <<<"$out"
      - name: archive
        run: |
          mkdir -p dist && cp build/static/geistr LICENSE THIRD_PARTY_LICENSES dist/
          tar -C dist -czf geistr-${{ matrix.target }}.tar.gz geistr LICENSE THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@v3
        with:
          name: geistr-${{ matrix.target }}
          path: geistr-${{ matrix.target }}.tar.gz

  macos:
    name: macos-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: build
        run: |
          brew install libomp
          make geistr
          strip build/geistr
      - name: only system libraries, and it answers
        run: |
          otool -L build/geistr
          other=$(otool -L build/geistr | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/)' || true)
          test -z "$other" || { echo "not a system library: $other"; exit 1; }
          make fetch-model
          answer=$(GEISTEN_HOME="$RUNNER_TEMP/h" build/geistr run \
            geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf 'What is the capital of France? One word.')
          echo "$answer" && grep -qi paris <<<"$answer"
      - name: archive
        run: |
          mkdir -p dist && cp build/geistr LICENSE THIRD_PARTY_LICENSES dist/
          tar -C dist -czf geistr-macos-arm64.tar.gz geistr LICENSE THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@v3
        with:
          name: geistr-macos-arm64
          path: geistr-macos-arm64.tar.gz

  # The Python wheels (#152): glibc/manylinux for Linux (built on the runner,
  # repaired with auditwheel, so tagged with the runner's glibc: ubuntu-24.04
  # gives manylinux_2_39) and macOS arm64. Each is installed into a clean venv and
  # answers once before it is kept.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, cc: gcc-14}
          - {runner: ubuntu-24.04-arm, cc: gcc-14}
          - {runner: macos-15, cc: clang}
    name: wheel ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sh scripts/apt-need.sh gcc-14
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: the wheel installs into a fresh venv; the example and the tests
        run: make fetch-model && make test-python
      - name: manylinux (linux), then a clean venv answers
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/tools && /tmp/tools/bin/pip install -q auditwheel patchelf
          PATH=/tmp/tools/bin:$PATH auditwheel repair build/wheel/geistr-*.whl -w build/wheelhouse
          python3 -m venv /tmp/clean && /tmp/clean/bin/pip install -q build/wheelhouse/geistr-*.whl
          cd /tmp && /tmp/clean/bin/python "$GITHUB_WORKSPACE/examples/chat.py" "$GITHUB_WORKSPACE/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf"
      - name: macOS wheel
        if: runner.os == 'macOS'
        run: mkdir -p build/wheelhouse && cp build/wheel/geistr-*.whl build/wheelhouse/
      - name: the wheel is this release
        run: |
          v=$(ls build/wheelhouse/geistr-*.whl | head -1 | sed 's|.*/geistr-\([0-9.]*\)-.*|\1|')
          test "v$v" = "${TAG}" || { echo "tag ${TAG} but the wheel is $v"; exit 1; }
      - uses: actions/upload-artifact@v3
        with:
          name: geistr-wheel-${{ matrix.runner }}
          path: build/wheelhouse/geistr-*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [linux, macos, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v3
        with:
          path: dist
          merge-multiple: true
      - name: one directory per artifact (download-artifact v3) -> dist/*.tar.gz
        run: find dist -mindepth 2 \( -name 'geistr-*.tar.gz' -o -name 'geistr-*.whl' \) -exec mv {} dist/ \; && find dist -mindepth 1 -type d -empty -delete && ls dist
      - name: the tag is the version geistr reports
        run: |
          version=$(sed -n 's/.*return "\([0-9.]*\)";.*/\1/p' src/runtime.c | head -1)
          test "v$version" = "${TAG}" || { echo "tag ${TAG} but geistr_version() is $version"; exit 1; }
      - name: upload to www.geisten.net/download/geistr/<tag>/, then "latest"
        # Org secret DOWNLOAD_SSH_KEY (as geistlib's release): rsync-only, write-only into
        # /var/www/htdocs/www.geisten.net/download (rrsync), so paths are relative to it.
        env:
          DOWNLOAD_SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
        run: |
          set -eu
          command -v rsync >/dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y rsync >/dev/null; }
          cd dist && sha256sum geistr-*.tar.gz geistr-*.whl > SHA256SUMS && cat SHA256SUMS && cd ..
          mkdir -p ~/.ssh && umask 077
          printf '%s\n' "$DOWNLOAD_SSH_KEY" > ~/.ssh/download_key
          echo "www.geisten.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO66CjOfnd/GIiCFyqhGxLudBXi/mCD0IA8DBbbZ2O2i" > ~/.ssh/known_hosts_download
          ssh_cmd="ssh -F /dev/null -i $HOME/.ssh/download_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_download"
          mkdir -p "stage/geistr/$TAG" && cp dist/* "stage/geistr/$TAG/"
          cp install.sh stage/geistr/install.sh
          chmod -R u=rwX,go=rX stage
          rsync -rlt --chmod=Du=rwx,Dgo=rx -e "$ssh_cmd" stage/ germar@www.geisten.net:
          base=https://www.geisten.net/download/geistr/$TAG
          for f in SHA256SUMS $(cd dist && ls geistr-*.tar.gz geistr-*.whl); do
            curl -fsS -o "/tmp/$f" "$base/$f"
          done
          (cd /tmp && sha256sum -c --ignore-missing SHA256SUMS) && cmp /tmp/SHA256SUMS dist/SHA256SUMS
          rm -rf stage && mkdir -p stage/geistr && ln -s "$TAG" stage/geistr/latest
          rsync -rlt -e "$ssh_cmd" stage/ germar@www.geisten.net:
      - name: publish the wheels to PyPI (when the secret PYPI_TOKEN is set)
        # Without the secret the wheels are on the release page only (pip install <URL>).
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}  # a PyPI API token, project scope "geistr"
        run: |
          set -eu
          if [ -z "${PYPI_TOKEN:-}" ]; then echo "PYPI_TOKEN is not set: the wheels are on the release page only"; exit 0; fi
          python3 -m venv /tmp/twine && /tmp/twine/bin/pip install -q twine
          /tmp/twine/bin/twine check dist/geistr-*.whl
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN" /tmp/twine/bin/twine upload --skip-existing dist/geistr-*.whl
      - name: update the Homebrew tap (github.com/geisten/homebrew-tap, Formula/geistr.rb)
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}  # GitHub token: contents + pull requests write on geisten/homebrew-tap only
        run: |
          set -eu
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/geisten/homebrew-tap.git" tap
          sh scripts/update-tap.sh "$TAG" dist/SHA256SUMS tap
          cd tap
          git add Formula/geistr.rb
          git diff --cached --quiet && { echo "tap already current"; exit 0; }
          git -c user.name="geisten release" -c user.email="release@geisten.net" commit -q -m "geistr ${TAG#v}"
          # straight to main; if main is protected, a branch and a pull request, as the tap's earlier updates
          git push -q origin HEAD:main || {
            git push -q origin "HEAD:refs/heads/geistr-${TAG#v}"
            curl -fsS -X POST -H "Authorization: Bearer $TAP_TOKEN" https://api.github.com/repos/geisten/homebrew-tap/pulls \
              -d "{\"title\":\"geistr ${TAG#v}\",\"head\":\"geistr-${TAG#v}\",\"base\":\"main\"}" >/dev/null
          }
